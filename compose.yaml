services:
  app:
    build:
      context: .
      dockerfile: dockerfiles/app-server.Dockerfile
    ports:
      - ${APP_PORT}:${APP_PORT}
    networks:
      - global


  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/custom.conf:ro
    depends_on:
      - app
    networks:
      - global


networks:
  global:

volumes:
  shared:
